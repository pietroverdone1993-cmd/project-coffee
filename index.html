<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #c79081, #dfa579);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 1.8em;
            color: #5a3825;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1em;
            color: #7a4b32;
            margin: 0;
        }

        .coffee {
            font-size: 3em;
            margin-top: 18px;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        /* 📱 Tablet */
        @media (min-width: 600px) {
            h1 {
                font-size: 2.1em;
            }

            p {
                font-size: 1.15em;
            }

            .coffee {
                font-size: 3.2em;
            }
        }

        /* 💻 Desktop */
        @media (min-width: 992px) {
            .card {
                padding: 45px 60px;
            }

            h1 {
                font-size: 2.4em;
            }

            p {
                font-size: 1.2em;
            }

            .coffee {
                font-size: 3.5em;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Ti andrebbe un caffè insieme?</h1>
        <p>Quando ti va ☺️</p>
        <div class="coffee">☕</div>
    </div>
</body>
</html>
