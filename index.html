<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Un caffè?</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #c79081, #dfa579);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .card {
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5em;
            color: #5a3825;
            margin: 0;
        }

        .coffee {
            font-size: 3em;
            margin-top: 15px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Ci prendiamo un caffè?</h1>
        <div class="coffee">☕</div>
    </div>
</body>
</html>
